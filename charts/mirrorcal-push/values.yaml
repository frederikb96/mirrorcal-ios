# Default configuration for mirrorcal-push.
#
# Every value an installer must actually supply is an empty string or false below, with a
# comment saying so — nothing here silently assumes Freddy's own cluster (a bundle id, a
# hostname, an ingress class, a storage class). See README.md for the full walkthrough.

image:
  repository: ghcr.io/frederikb96/mirrorcal-push
  # Empty: defaults to .Chart.AppVersion. Set explicitly to pin a different tag.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

apns:
  # APNs auth key id and Apple Developer team id — from App Store Connect. Not secret.
  keyId: ""
  teamId: ""
  # The app's own bundle id. Becomes the APNs topic, so a wrong value here fails loud
  # (APNs rejects with DeviceTokenNotForTopic) rather than silently reaching no one.
  bundleId: ""
  authKey:
    # Name of a pre-existing Secret holding the .p8 key content — the preferred path for
    # anyone who already manages secrets their own way (SOPS, sealed-secrets, Vault, or
    # a plain `kubectl create secret`). Takes priority over `value` below when set.
    existingSecret: ""
    existingSecretKey: "AuthKey.p8"
    # Inline PEM content — for a five-minute install. The chart creates the Secret for
    # you if this is set and existingSecret is not. Never commit a real value here.
    value: ""

registration:
  sharedSecret:
    # Same existingSecret/value shape as apns.authKey above, for the bearer secret the
    # app's own settings screen and this chart must both hold.
    existingSecret: ""
    existingSecretKey: "shared-secret"
    value: ""

push:
  # How often the ticker fans a silent push out to every registered device. Twenty
  # minutes sits inside Apple's own throttle for background pushes (roughly 2-3/hour)
  # with headroom. There is no sandbox/production toggle: TestFlight and App Store
  # builds both only ever talk to APNs production, so there is nothing to switch.
  intervalMinutes: 20

service:
  port: 8080

ingress:
  enabled: true
  # Empty uses the cluster's default IngressClass. Set explicitly (e.g. "traefik",
  # "nginx") when the cluster has more than one or defines none as default.
  className: ""
  # Required when ingress.enabled — the hostname this service is reachable at, e.g.
  # "mirrorcal-push.example.com". Left empty on purpose so an install cannot silently
  # inherit a hostname that means nothing to a stranger's cluster.
  host: ""
  annotations: {}
  tls:
    enabled: true
    # Name of the Secret holding the TLS cert. If certManager.enabled below, cert-manager
    # creates and populates this Secret; otherwise you must provide it yourself.
    secretName: ""
    certManager:
      # A generic chart cannot assume cert-manager exists on every cluster it's
      # installed to, so this is opt-in rather than assumed.
      enabled: false
      issuerName: ""
      issuerKind: ClusterIssuer

persistence:
  enabled: true
  size: 256Mi
  # Empty uses the cluster's default StorageClass.
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

serviceMonitor:
  # Opt-in Prometheus Operator ServiceMonitor — a generic chart installer may run no
  # Prometheus at all.
  enabled: false
  interval: 1m
  # Extra labels the ServiceMonitor needs to be picked up by a given Prometheus
  # instance — e.g. `release: kube-prometheus-stack` is the kube-prometheus-stack
  # convention (the operator's own Prometheus CR selects ServiceMonitors by label).
  labels: {}

alerts:
  # Opt-in PrometheusRule alerting on "no successful push in N hours" — the answer to
  # "did the push even go out" without anyone needing to read a log. Requires
  # serviceMonitor.enabled (or a Prometheus scraping /metrics some other way) to mean
  # anything.
  enabled: false
  noSuccessHours: 2
  labels: {}

# The image's own uid/gid (65532, distroless/static's built-in "nonroot" user).
# fsGroup is what actually matters here: without it, the persistence volume mounts
# owned by root and this non-root container cannot write its own token store.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# No default requests: a generic chart cannot guess the right floor for a cluster it
# has never run on. Freddy's own release overrides this from measured idle — see
# README.md's cluster deployment section.
resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
