apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mirrorcal-push.fullname" . }}
  labels:
    {{- include "mirrorcal-push.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so a surging new pod cannot
  # even schedule while the old one still holds it — Recreate takes the old pod down
  # first, which is also the shape a single-writer file store wants regardless of
  # storage mode.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mirrorcal-push.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mirrorcal-push.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mirrorcal-push
          image: "{{ .Values.image.repository }}:{{ include "mirrorcal-push.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "mirrorcal-push.fullname" . }}-config
          env:
            - name: REGISTRATION_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mirrorcal-push.sharedSecretSecretName" . }}
                  key: {{ .Values.registration.sharedSecret.existingSecretKey }}
          volumeMounts:
            - name: apns-key
              mountPath: /secrets/apns
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: apns-key
          secret:
            secretName: {{ include "mirrorcal-push.authKeySecretName" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mirrorcal-push.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
