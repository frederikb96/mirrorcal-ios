{{/*
This chart creates a Secret only for the values an installer chose to hand over inline
(apns.authKey.value / registration.sharedSecret.value). Anyone pointing at an
existingSecret already owns that Secret elsewhere — this chart never touches it.
*/}}
{{- if and (not .Values.apns.authKey.existingSecret) (not .Values.apns.authKey.value) }}
{{- fail "Set apns.authKey.existingSecret (a Secret you manage) or apns.authKey.value (inline PEM) — the .p8 key has to come from somewhere." }}
{{- end }}
{{- if and (not .Values.registration.sharedSecret.existingSecret) (not .Values.registration.sharedSecret.value) }}
{{- fail "Set registration.sharedSecret.existingSecret or registration.sharedSecret.value — the app and this chart must agree on one." }}
{{- end }}
{{- if not .Values.apns.authKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mirrorcal-push.authKeySecretName" . }}
  labels:
    {{- include "mirrorcal-push.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apns.authKey.existingSecretKey }}: {{ .Values.apns.authKey.value | quote }}
{{- end }}
---
{{- if not .Values.registration.sharedSecret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mirrorcal-push.sharedSecretSecretName" . }}
  labels:
    {{- include "mirrorcal-push.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.registration.sharedSecret.existingSecretKey }}: {{ .Values.registration.sharedSecret.value | quote }}
{{- end }}
