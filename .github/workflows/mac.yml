name: Mac

# Everything that genuinely needs Apple hardware — building the app target, and running it in a
# simulator to see what it draws.
#
# 🚨 **Not triggered by pushes to main, deliberately.** A Mac run takes ten to thirty minutes and
# queues for a scarcer machine, so firing one on every commit buries the answer you wanted under
# twenty you did not. Work on a branch, then ask for one run when there is something worth
# looking at — `gh workflow run mac.yml` — or open a pull request. Batch the questions into that
# one run rather than spending several to answer them one at a time.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_app:
        description: 'Boot a simulator and run the app (slower; skip for a compile-only check)'
        type: boolean
        default: true
      configuration:
        description: 'Build configuration. Release before a release — DEBUG-only code compiles out, and that error surfaces nowhere else.'
        type: choice
        options: [Debug, Release]
        default: Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, on every trigger, path filter or not — a job gated by `paths:` on the trigger
  # itself simply never starts when nothing matched, which is fine for an optional check but
  # leaves a *required* one stuck pending forever. `mac-ok` below is what stays reportable
  # either way; this job only decides whether `build` itself has anything to do. `dispatch`
  # ignores path filters regardless, so a manually requested run is never skipped by this.
  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            swift:
              - 'MirrorCal/**'
              - 'MirrorCalKit/**'
              - 'MirrorCal.xcodeproj/**'
              - 'Config/**'
              - '.github/workflows/mac.yml'

  build:
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.swift == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-${{ runner.os }}-${{ hashFiles('MirrorCalKit/Package.swift', 'MirrorCal.xcodeproj/project.pbxproj') }}
          restore-keys: dd-${{ runner.os }}-

      # Everything else in the package is already green from free-checks, so this builds only the
      # app target — the part that needs an iOS SDK.
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild -project MirrorCal.xcodeproj -scheme MirrorCal \
            -destination 'generic/platform=iOS Simulator' \
            -configuration "${{ inputs.configuration || 'Debug' }}" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/build.log | tail -20

      - name: Surface compiler errors
        if: failure()
        run: |
          grep -E "error:" /tmp/build.log | head -40 || echo "no compiler errors in the log"

      # Whether the array-valued keys in `Config/Info.plist` actually reached the built bundle —
      # invisible in a screenshot, invisible to a compile, and fails at the moment a background
      # task or a silent push is due, which reads as iOS refusing to cooperate rather than as a
      # missing declaration. Checks a key from `Config/Info.plist` AND one that only
      # `GENERATE_INFOPLIST_FILE` produces, because the risk runs both ways: pointing
      # `INFOPLIST_FILE` at a real plist can stop the generated keys merging in.
      - name: The built bundle declares what it needs
        run: |
          set -o pipefail
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          plutil -p "$app/Info.plist" > /tmp/built-info.txt
          grep -q '"fetch"' /tmp/built-info.txt \
            || { echo '::error::UIBackgroundModes is missing "fetch" — BGAppRefreshTask never runs'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q '"processing"' /tmp/built-info.txt \
            || { echo '::error::UIBackgroundModes is missing "processing" — BGProcessingTask never runs'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q '"remote-notification"' /tmp/built-info.txt \
            || { echo '::error::UIBackgroundModes is missing "remote-notification" — a silent push never wakes the app'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q 'com.frederikberg.mirrorcal.refresh' /tmp/built-info.txt \
            || { echo '::error::BGTaskSchedulerPermittedIdentifiers is missing the refresh task id'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q 'com.frederikberg.mirrorcal.reconcile' /tmp/built-info.txt \
            || { echo '::error::BGTaskSchedulerPermittedIdentifiers is missing the reconcile task id'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q 'NSCalendarsFullAccessUsageDescription' /tmp/built-info.txt \
            || { echo '::error::the generated Info.plist keys were not merged in — INFOPLIST_FILE may have replaced them'; \
                 cat /tmp/built-info.txt; exit 1; }
          echo 'background modes, background task identifiers, and generated keys all present'

      - name: Boot a simulator
        id: sim
        if: inputs.run_app != false
        run: |
          # Chosen from what the image actually has: runner images change their device list
          # between releases, and a hardcoded name fails late and confusingly.
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime: continue
              for d in devices[runtime]:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid']); raise SystemExit
          ")
          [ -n "$udid" ] || { echo 'no iPhone simulator available'; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Freddy runs the app in dark mode, and every design judgement made from a light
          # screenshot is a judgement about a screen nobody looks at.
          xcrun simctl ui "$udid" appearance dark

      - name: Install the app
        if: inputs.run_app != false
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          xcrun simctl install "$udid" "$app"

      # The debug bridge and fixture mode only exist in Debug builds — the router, its routes,
      # and `FixtureCalendarStore` are all `#if DEBUG`. `--mirrorcal-fixtures` seeds the app with
      # `EventFixtures.all` through a fake calendar store, so every screen has realistic,
      # populated data even though this simulator holds no calendar accounts at all.
      #
      # Each screen is driven through `/navigate` rather than `idb` or a human — this runner has
      # neither. `/screen` is asked again and asserted before each screenshot: `/navigate`
      # answering only proves the router accepted the request, not that the screen has actually
      # drawn, and a size floor alone cannot tell a wrong screen from the right one — both are
      # real, well-rendered screens that pass every byte-count check.
      - name: Screenshot each screen in fixture mode
        if: inputs.run_app != false && (inputs.configuration || 'Debug') == 'Debug'
        run: |
          set -o pipefail
          mkdir -p artifacts
          udid="${{ steps.sim.outputs.udid }}"
          bundle=com.frederikberg.mirrorcal

          xcrun simctl launch "$udid" "$bundle" --mirrorcal-fixtures > /dev/null
          ok=0
          for attempt in $(seq 1 10); do
            if curl -sS --max-time 3 "http://127.0.0.1:8765/health" -o artifacts/health.json; then
              ok=1
              break
            fi
            sleep 2
          done
          [ "$ok" -eq 1 ] || { echo "::error::debug bridge never answered"; exit 1; }

          sleep 6

          # Bypasses the calendar-picker sheet, which nothing here can tap — this is what lets
          # the /sync call further down exercise a genuine sync through the fixture-backed
          # EventKit-shaped adapters rather than only ever hitting the not-configured rejection
          # path a fresh install starts in.
          curl -sS --max-time 5 -X POST -H 'Content-Type: application/json' \
            -d '{"source": "fixture-source", "destination": "fixture-destination", "enabled": "true"}' \
            "http://127.0.0.1:8765/configure" -o artifacts/configure.json

          for screen in status configuration log; do
            curl -sS --max-time 5 -X POST -H 'Content-Type: application/json' \
              -d "{\"screen\": \"$screen\"}" "http://127.0.0.1:8765/navigate" -o /dev/null

            actual=$(curl -sS --max-time 5 "http://127.0.0.1:8765/screen" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["screen"])')
            [ "$actual" = "$screen" ] \
              || { echo "::error::asked for screen '$screen', bridge reports '$actual'"; exit 1; }

            sleep 2
            xcrun simctl io "$udid" screenshot "artifacts/screen-$screen.png"
            bytes=$(stat -f %z "artifacts/screen-$screen.png")
            echo "screen-$screen.png is ${bytes} bytes"
            [ "$bytes" -gt 20000 ] \
              || { echo "::error::screen-$screen.png is suspiciously small — the screen may be blank"; exit 1; }
          done

          # Exercises the fixture-backed sync end to end, now that /configure above has given it
          # somewhere to write — asserted rather than merely dumped, since a sync that silently
          # failed here would read as "configured" everywhere else.
          #
          # Asserts created+unchanged rather than created alone: enabling sync in /configure
          # already triggers one run of its own (AppSyncEngine's "just turned on" behaviour), so
          # by the time this call fires, the fixture corpus may already be mirrored and this
          # second run correctly reports it as unchanged instead of created — that is the
          # idempotence the package's own tests pin, not a sign nothing happened.
          curl -sS --max-time 30 -X POST "http://127.0.0.1:8765/sync" -o artifacts/sync-outcome.json
          python3 -c "
          import json
          outcome = json.load(open('artifacts/sync-outcome.json'))
          assert 'created' in outcome, f'sync did not return an outcome: {outcome}'
          assert outcome['created'] + outcome['unchanged'] > 0, f'expected the fixture corpus to be mirrored, got {outcome}'
          print(f\"sync outcome: {outcome}\")
          "
          curl -sS --max-time 5 "http://127.0.0.1:8765/state" -o artifacts/state.json || true
          curl -sS --max-time 5 "http://127.0.0.1:8765/calendars" -o artifacts/calendars.json || true

          xcrun simctl terminate "$udid" "$bundle" || true

      # No fixture mode and no debug bridge in Release — this is the plain "does it draw
      # anything" check the Debug path above replaces with a debug-bridge-backed screenshot.
      - name: Screenshot the running app
        if: inputs.run_app != false && (inputs.configuration || 'Debug') == 'Release'
        run: |
          mkdir -p artifacts
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl launch "$udid" com.frederikberg.mirrorcal
          # launch returns once the process exists, which is before it has drawn anything.
          sleep 8
          xcrun simctl io "$udid" screenshot artifacts/screen.png
          bytes=$(stat -f %z artifacts/screen.png)
          echo "screenshot is $bytes bytes"
          [ "$bytes" -gt 20000 ] || { echo 'suspiciously small — the screen may be blank'; exit 1; }

      # Filtered on the app's own logging subsystem, not on process — `processImagePath CONTAINS
      # "MirrorCal"` also captures every system framework logging on the app's behalf, and the
      # debug bridge's own loopback listener makes most of that Network.framework connection
      # chatter. This is the only place a fault on a real device (no debugger, no Log screen if
      # the app never gets that far) is visible at all, so it needs to carry the app's own events.
      - name: Application logs
        if: always() && inputs.run_app != false
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 3m --style compact \
            --predicate 'subsystem == "com.frederikberg.mirrorcal"' > artifacts/app.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-artifacts
          path: artifacts/
          retention-days: 14

  # What a branch-protection rule should name as required, if one is ever added: this runs
  # whether `build` ran, was skipped by the path filter, or failed, and reports accordingly.
  # `!cancelled()` rather than `always()` — `always()` would also run (and report) after this
  # workflow was itself cancelled by the `concurrency` group above superseding it, which is not
  # a real failure and should not be reported as one.
  mac-ok:
    name: Mac ok
    needs: [detect, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if build did not succeed or was skipped
        run: |
          result="${{ needs.build.result }}"
          [ "$result" = "success" ] || [ "$result" = "skipped" ] || { echo "build: $result"; exit 1; }
