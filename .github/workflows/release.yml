name: Release

# Tag-triggered, PLUS workflow_dispatch — a pushed tag cannot be reused, so exercising this
# workflow without minting a throwaway tag (or worse, discovering a bug only after one exists) is
# worth the extra trigger.
on:
  push:
    tags: ['v*.*.*']
  # TestFlight builds expire after 90 days. Runs well inside that window so a failure has room to
  # be noticed and retried before the app actually stops launching.
  schedule:
    - cron: '43 4 15 */2 *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 0.1.0). Ignored for tag pushes.'
        required: true
        default: '0.0.1'
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    # The 6-hour default would hold a scarce Mac runner for a whole afternoon before failing.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # The runner image's default Xcode changes underneath you; pin it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # fastlane is pinned in the Gemfile rather than installed via brew, so CI and the rented
      # Mac resolve the same versions.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The git tag is the single source of truth for the marketing version. run_number gives a
      # monotonic build number for free — App Store Connect requires the build number to be
      # unique and increasing within a marketing version, and nothing hand-maintained stays that
      # way forever.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "marketing=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # No test step: the package and its tests run on every push to main in `free-checks.yml`,
      # on Linux, in a couple of minutes. Repeating them here would rebuild the whole package on
      # a scarce Mac runner to re-prove what is already green on this commit. The release-config
      # compile error a debug build would miss is still caught — by `fastlane build` below,
      # which archives Release.

      - name: Build and sign
        run: bundle exec fastlane build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}

      # 🚨 UPLOADING IS NOT DISTRIBUTING. The lane sets `skip_waiting_for_build_processing`
      # deliberately — waiting would hold the Mac runner for 10-30 idle minutes — which also means
      # fastlane cannot attach the build to a beta group, because Apple has not finished
      # processing it yet. A build that is uploaded and VALID but attached to no group is
      # installable by NOBODY, and looks identical to a successful release from every angle
      # available here: the job is green, App Store Connect lists the build, and the phone shows
      # nothing. The `distribute` job below closes that gap.
      - name: Upload to TestFlight
        if: github.ref_type == 'tag' || github.event.inputs.upload == 'true'
        run: bundle exec fastlane upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}

      # The .ipa is useless outside TestFlight. The dSYMs are what you actually want later, for
      # symbolicating a crash report.
      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*.dSYM.zip

  # Uploading is not distributing, and the difference is invisible: a build can be VALID in App
  # Store Connect, listed by every query, and installable by nobody. This job closes that gap.
  #
  # Its own runner, and a plain Ubuntu one: attaching a build is authenticated HTTPS and needs no
  # Apple hardware, so it has no business occupying a Mac — and the waiting this job does
  # (Apple's processing, minutes) is precisely the wait the upload lane refuses to do on macOS.
  #
  # A red job here means the build shipped but reached nobody, which is worth seeing rather than
  # swallowing.
  distribute:
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - run: pip install --quiet 'pyjwt[crypto]'

      # The build number is the run number, set by the build job from the same source.
      - name: Attach the build to the beta group
        run: python3 Tooling/distribute-build.py "${{ github.run_number }}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
