name: Push sidecar release

# Tag-triggered publish of the two things a chart install needs: the container image on
# GHCR (public, so an install needs no pull secret) and the chart itself, published via
# chart-releaser to this repo's own gh-pages branch — never vendored into the cluster repo
# that consumes it. `kube-borg-backup`'s own release-pipeline.yaml is the literal template
# this follows.
#
# Tag prefix is scoped to this component (`push-sidecar-v*`), distinct from whatever tag
# scheme the iOS app itself eventually uses, since the two are versioned and released
# independently in one repo.
on:
  push:
    tags:
      - 'push-sidecar-v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: push-sidecar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: push-sidecar/go.sum
      - run: go vet ./...
      - run: go test ./...

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with: { version: v3.17.0 }
      - run: helm lint charts/mirrorcal-push

  release-helm:
    runs-on: ubuntu-latest
    needs: [go, helm-lint]
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_existing: true
          charts_dir: charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_RELEASE_NAME_TEMPLATE: "{{ .Name }}-{{ .Version }}"
          CR_GENERATE_RELEASE_NOTES: true

  build-image:
    runs-on: ubuntu-latest
    needs: [go, helm-lint]
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: ver
        run: |
          version=${GITHUB_REF#refs/tags/push-sidecar-v}
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: push-sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/mirrorcal-push:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/mirrorcal-push:latest

      # A freshly-pushed GHCR package defaults to PRIVATE regardless of the repository's own
      # visibility, and GITHUB_TOKEN has no documented, reliable way to flip that itself —
      # doing it here would be an unverified API call standing in for a real check. This is a
      # one-time step, not a per-release one: once the package is public, every later push to
      # the same tag stays public. See the chart README's install section for the manual step
      # (package Settings → Change visibility) required after the very first run of this job.
